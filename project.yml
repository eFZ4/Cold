name: Cold
options:
  bundleIdPrefix: com.cold
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug
  xcodeVersion: "16"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: ""

targets:
  Cold:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: iPhoneApp
      - path: Shared
    resources:
      - path: Resources
    entitlements:
      path: iPhoneApp/iPhoneApp.entitlements
    info:
      path: iPhoneApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Cold reads your workout data to display your cold immersion history."
        NSHealthUpdateUsageDescription: "Cold saves your cold water immersion workouts and water temperature to Apple Health."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cold.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: ColdWatch
        embed: true

  ColdWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
      - path: Shared
    resources:
      - path: Resources
    entitlements:
      path: WatchApp/WatchApp.entitlements
    info:
      path: WatchApp/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.cold.app
        NSHealthShareUsageDescription: "Cold reads your workout data to display your cold immersion history."
        NSHealthUpdateUsageDescription: "Cold saves your cold water immersion workouts and water temperature to Apple Health."
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cold.app.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  ColdTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ColdTests
    dependencies:
      - target: ColdWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cold.app.watchkitapp.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ColdWatch.app/ColdWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Cold:
    build:
      targets:
        Cold: all
        ColdWatch: all
        ColdTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ColdTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  ColdWatch:
    build:
      targets:
        ColdWatch: all
        ColdTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ColdTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
